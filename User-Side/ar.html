<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Navigate CSUL AR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

#info{
    position:fixed;
    top:20px;
    left:20px;
    z-index:99999;
    background:rgba(0,0,0,.7);
    color:#fff;
    padding:15px 20px;
    border-radius:10px;
    border:2px solid #00ff00;
    font-size:20px;
    line-height:1.8;
    pointer-events:none;
}

#destination{
    color:#00ff00;
    font-weight:bold;
}

#distance{
    color:yellow;
    font-weight:bold;
}
</style>

</head>
<body>

<video id="camera" autoplay playsinline muted></video>

<div id="info">
    <div>🎯 <b>Destination</b></div>
    <div id="destination">CICS Building</div>

    <br>

    <div>📏 <b>Distance</b></div>
    <div><span id="distance">120</span> meters</div>
</div>

<script>

const video = document.getElementById("camera");

async function startCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:{ideal:"environment"}
            },
            audio:false
        });

        video.srcObject = stream;

    }catch(err){

        alert("Camera Error: " + err.message);
        console.log(err);

    }

}

window.onload = startCamera;

</script>

</body>
</html>
