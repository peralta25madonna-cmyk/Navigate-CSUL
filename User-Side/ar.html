<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Navigate CSUL AR</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}

video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
}

#info{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(0,0,0,.65);
    color:#fff;
    padding:15px 20px;
    border-radius:12px;
    font-size:18px;
    line-height:1.8;
    z-index:10;
}

</style>

</head>

<body>

<video id="camera" autoplay playsinline></video>

<div id="info">

<b>🎯 Destination</b><br>
<span id="destination">CICS Building</span>

<br><br>

<b>📏 Distance</b><br>
<span id="distance">120</span> meters

</div>

<script>

const video = document.getElementById("camera");

async function startCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment"
            },
            audio:false
        });

        video.srcObject = stream;

    }catch(error){

        alert("Unable to access camera.");
        console.error(error);

    }

}

startCamera();

</script>

</body>
</html>
