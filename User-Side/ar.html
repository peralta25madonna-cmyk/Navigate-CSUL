<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Navigation</title>

<script type="module" src="/app.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

/* camera area */
#ar-container{
    width:100vw;
    height:100vh;
}

/* information */
#info{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(0,0,0,.6);
    color:white;
    padding:15px;
    border-radius:10px;
    z-index:10;
}

</style>

</head>


<body>


<div id="ar-container">

</div>


<div id="info">
Loading AR Camera...
</div>


<script>


window.onload=function(){

    let current = localStorage.getItem("currentLocation");
    let destination = localStorage.getItem("selectedDestination");


    document.getElementById("info").innerHTML =
    `
    📍 Current Location: ${current || "Main Gate"} <br>
    🎯 Destination: ${destination || "None"} <br><br>
    Starting Camera...
    `;


}


// CAMERA TEST

navigator.mediaDevices.getUserMedia({

    video:{
        facingMode:"environment"
    }

})

.then(stream=>{

    console.log("Camera Opened");

    document.getElementById("info").innerHTML +=
    "<br>✅ Camera Working";


})

.catch(error=>{

    console.log(error);

    document.getElementById("info").innerHTML +=
    "<br>❌ Camera Error";

});


</script>


</body>
</html>
