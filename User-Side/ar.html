<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Camera Test</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}


/* CAMERA */
video{
    position:absolute;
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    object-fit:cover;

    z-index:1;
}


/* STATUS */
#info{

    position:fixed;

    top:20px;
    left:20px;

    background:rgba(0,0,0,.6);

    color:white;

    padding:15px;

    border-radius:10px;

    z-index:10;

    font-family:Arial;

}



/* HOME BUTTON */

.home-btn{

    position:fixed;

    bottom:30px;

    left:50%;

    transform:translateX(-50%);


    padding:15px 35px;


    border:none;

    border-radius:30px;


    background:#00ff88;

    color:black;


    font-size:18px;

    font-weight:bold;


    z-index:9999;


    cursor:pointer;


}


.home-btn:active{

    transform:translateX(-50%) scale(.95);

}


</style>


</head>


<body>


<div id="info">
Starting Camera...
</div>


<video id="camera" autoplay playsinline></video>



<button class="home-btn" onclick="goHome()">
🏠 Home
</button>



<script>


const video = document.getElementById("camera");

const info = document.getElementById("info");



navigator.mediaDevices.getUserMedia({

    video:{

        facingMode:{

            ideal:"environment"

        }

    },

    audio:false

})


.then(stream=>{


    video.srcObject = stream;


    info.innerHTML =
    "✅ Camera Working";


    console.log("Camera started");


})


.catch(error=>{


    info.innerHTML =
    "❌ Camera Error: " + error.message;


    console.log(error);


});





function goHome(){

    window.location.href = "home.html";

}



</script>


</body>
</html>
