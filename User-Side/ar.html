<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Navigation</title>

<script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
<script src="https://apps.8thwall.com/xrweb?appKey=YOUR_APP_KEY"></script>

<style>

body{
    margin:0;
    overflow:hidden;
}

#info{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(0,0,0,.6);
    color:white;
    padding:15px;
    border-radius:10px;
    z-index:10;
    font-family:Arial;
}

</style>

</head>


<body>

<div id="info">
    Loading AR Navigation...
</div>


<script>

window.onload=function(){

    let current = localStorage.getItem("currentLocation");
    let destination = localStorage.getItem("selectedDestination");


    document.getElementById("info").innerHTML =
    `
    📍 Current Location: ${current || "Main Gate"} <br>
    🎯 Destination: ${destination || "None"} <br><br>
    AR Camera Ready
    `;

}

</script>


</body>
</html>
