<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Camera Test</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}

video{
    width:100vw;
    height:100vh;
    object-fit:cover;
}

#info{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(0,0,0,.6);
    color:white;
    padding:15px;
    border-radius:10px;
    z-index:999;
    font-family:Arial;
    font-size:18px;
    line-height:1.8;
}

</style>

</head>

<body>

<video id="camera" autoplay playsinline></video>

<div id="info">
    <b>🎯 Destination</b><br>
    <span id="destination">CICS Building</span>

    <br><br>

    <b>📏 Distance</b><br>
    <span id="distance">120</span> meters
</div>

<script>

const video = document.getElementById("camera");

navigator.mediaDevices.getUserMedia({

    video:{
        facingMode:{
            ideal:"environment"
        }
    },

    audio:false

})

.then(stream=>{

    video.srcObject = stream;

    console.log("Camera started");

})

.catch(error=>{

    document.getElementById("info").innerHTML =
    "❌ Camera Error: " + error;

    console.log(error);

});

</script>

</body>
</html>
