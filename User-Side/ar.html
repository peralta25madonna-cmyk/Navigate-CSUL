<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Camera Test</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}


/* CAMERA */
video{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;
}


/* TEST TEXT */
.test{
    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:red;

    font-size:50px;

    font-weight:bold;

    z-index:999999;

}


/* STATUS */
#info{

    position:fixed;

    top:20px;
    left:20px;

    background:rgba(0,0,0,.7);

    color:white;

    padding:15px;

    border-radius:10px;

    font-size:18px;

    z-index:999999;

}


/* BUTTON */
.home-btn{

    position:fixed;

    bottom:30px;

    left:50%;

    transform:translateX(-50%);


    background:#00ff88;

    color:black;


    padding:15px 35px;


    border:none;

    border-radius:30px;


    font-size:20px;

    font-weight:bold;


    z-index:999999;


}


</style>

</head>


<body>


<video id="camera" autoplay playsinline></video>


<div class="test">
AR HTML TEST
</div>


<div id="info">
Starting Camera...
</div>


<button class="home-btn" onclick="goHome()">
🏠 HOME
</button>



<script>


const video = document.getElementById("camera");

const info = document.getElementById("info");



navigator.mediaDevices.getUserMedia({

    video:{
        facingMode:{
            ideal:"environment"
        }
    },

    audio:false

})


.then(stream=>{


    video.srcObject = stream;


    info.innerHTML =
    "✅ Camera Working";


    console.log("Camera started");


})


.catch(error=>{


    info.innerHTML =
    "❌ Camera Error: " + error.message;


    console.log(error);


});



function goHome(){

    window.location.href="home.html";

}


</script>


</body>
</html>
