<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Camera Test</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}


/* CAMERA */
video{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;
}


/* TEXT */
#info{

    position:fixed;

    top:20px;
    left:20px;

    background:red;

    color:white;

    padding:15px;

    font-size:20px;

    z-index:99999;

}



/* BUTTON */

.home-btn{

    position:fixed;

    bottom:30px;

    left:50%;

    transform:translateX(-50%);

    background:lime;

    color:black;

    padding:20px 40px;

    border:none;

    border-radius:20px;

    font-size:20px;

    z-index:99999;

}


</style>

</head>


<body>


<video id="camera" autoplay playsinline></video>


<div id="info">
TEST OVERLAY
</div>


<button class="home-btn" onclick="goHome()">
HOME
</button>



<script>


const video = document.getElementById("camera");


navigator.mediaDevices.getUserMedia({

video:{
    facingMode:"environment"
},

audio:false

})


.then(stream=>{

video.srcObject = stream;


})


.catch(error=>{

document.getElementById("info").innerHTML =
error;


});



function goHome(){

window.location.href="home.html";

}


</script>


</body>
</html>
