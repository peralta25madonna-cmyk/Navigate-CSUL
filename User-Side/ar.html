<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Camera Test</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}

video{
    width:100vw;
    height:100vh;
    object-fit:cover;
}

#info{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(0,0,0,.6);
    color:white;
    padding:15px;
    border-radius:10px;
    z-index:10;
    font-family:Arial;
    font-size:18px;
}

</style>

</head>

<body>


<div id="info">
Starting Camera...
</div>


<video id="camera" autoplay playsinline></video>



<script>


const video = document.getElementById("camera");
const info = document.getElementById("info");



async function startCamera(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                }
            },

            audio:false

        });


        video.srcObject = stream;


        await video.play();


        info.innerHTML =
        `
        ✅ Camera Working <br><br>
        📷 Rear Camera Active
        `;


        console.log("Camera started successfully");


    }

    catch(error){


        info.innerHTML =
        `
        ❌ Camera Error <br>
        ${error.name}<br>
        ${error.message}
        `;


        console.log(
            "Camera Error:",
            error
        );

    }

}



startCamera();


</script>


</body>
</html>
