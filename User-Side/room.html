<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Information</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}


body{
    min-height:100vh;
    background:linear-gradient(130deg, #a9f99e, #46add5);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    border-radius:28px;
    padding:28px 24px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    position:relative;
    overflow:hidden;
    background:#fff;
}

/* BUILDING THEMES */
body[data-building="cics"] .container{
    background:#e7bd64; /* orange */
}

body[data-building="chm"] .container{
    background:#e26c94; /* pink */
}

body[data-building="cted"] .container{
    background:#5fa2dd; /* blue */
}

body[data-building="agriculture"] .container{
    background:#67df67; /* green */
}

.header{
    text-align:center;
    position:relative;
    z-index:1;
}

.header h2{
    color:#000;
    font-size:16px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:6px;
}

.header h1{
    color:#000;
    font-size:28px;
    margin-bottom:18px;
}

img{
    width:100%;
    height:320px;
    object-fit:contain;
    background:#f8f8f8;
    border-radius:20px;
    padding:10px;
    margin-bottom:20px;
}

.info-card{
    background:#f7f7f7;
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
}

.info-card strong{
    display:block;
    color:#006633;
    margin-bottom:6px;
    font-size:15px;
}

.info-card p{
    color:#444;
    line-height:1.5;
}

.button-group{
    display:flex;
    gap:10px;
    margin-top:16px;
}

.button-group button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:16px;
    background:#19ced1;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:background 0.3s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}


.button-group button i{
    font-size:16px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Room Information</h2>
        <h1 id="roomName">Room Name</h1>
    </div>

    <img id="roomImage"
    src="https://via.placeholder.com/500x220?text=Room"
    alt="Room">

    <div class="info-card">
        <strong>Building</strong>
        <p id="building"></p>
    </div>

    <div class="info-card">
        <strong>Room Type</strong>
        <p id="roomType"></p>
    </div>

    <div class="info-card">
        <strong>Description</strong>
        <p id="description"></p>
    </div>

    <div class="info-card">
        <strong>Facilities</strong>
        <p id="facilities"></p>
    </div>

    <div class="info-card">
        <strong>Availability</strong>
        <p id="availability"></p>
    </div>

    <div class="info-card">
        <strong>Floor Level</strong>
        <p id="floorLevel"></p>
    </div>

    <div class="button-group">
        <button onclick="goHome()">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>

        <button onclick="scanAgain()">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Scan QR Again</span>
        </button>
    </div>

</div>

<script>
const room = localStorage.getItem("room");

const roomInfo = {
    "https://cicsbuilding.com/room1": {
        building: "College of Information and Computing Sciences (CICS) Building",
        room: "CICS Room 1",
        type: "Computer Laboratory",
        description: "Computer laboratory for programming and networking classes.",
        facilities: "Desktop computers, projector, Wi-Fi",
        availability: "Monday - Friday (7:00 AM - 5:00 PM)",
        floorLevel: "2nd Floor",
        image: "BSIT 4B (1).png"
    },

    "https://chmbuilding.com/room1": {
        building: "College of Hospitality Management Building",
        room: "CHM Room 1",
        type: "Kitchen Laboratory",
        description: "Room used for hospitality and culinary practical activities.",
        facilities: "Kitchen equipment, projector, Wi-Fi",
        availability: "Monday - Friday (7:00 AM - 5:00 PM)",
        floorLevel: "1st Floor",
        image: "4th-1Sem - BSHM.png"
    },

    "https://ctedbuilding.com/room1": {
        building: "College of Teacher Education Building",
        room: "CTED Room 1",
        type: "Lecture Room",
        description: "Room used for teacher education lectures and activities.",
        facilities: "Projector, whiteboard, Wi-Fi",
        availability: "Monday - Friday (7:00 AM - 5:00 PM)",
        floorLevel: "2nd Floor",
        image: "../Images/cted-room.jpg"
    },

    "https://agriculturebuilding.com/room1": {
        building: "College of Agriculture Building",
        room: "Agriculture Room 1",
        type: "Laboratory",
        description: "Laboratory for agriculture practical activities.",
        facilities: "Lab equipment, sink, projector",
        availability: "Monday - Friday (7:00 AM - 5:00 PM)",
        floorLevel: "1st Floor",
        image: "agri-room.jpg"
    }
};

if(roomInfo[room]){
    document.getElementById("roomName").textContent = roomInfo[room].room;
    document.getElementById("building").textContent = roomInfo[room].building;
    document.getElementById("roomType").textContent = roomInfo[room].type;
    document.getElementById("description").textContent = roomInfo[room].description;
    document.getElementById("facilities").textContent = roomInfo[room].facilities;
    document.getElementById("availability").textContent = roomInfo[room].availability;
    document.getElementById("floorLevel").textContent = roomInfo[room].floorLevel || "-";
    document.getElementById("roomImage").src = roomInfo[room].image;

    const buildingName = roomInfo[room].building;

    if(buildingName.includes("CICS")){
        document.body.setAttribute("data-building", "cics");
    }else if(buildingName.includes("Hospitality")){
        document.body.setAttribute("data-building", "chm");
    }else if(buildingName.includes("Teacher")){
        document.body.setAttribute("data-building", "cted");
    }else if(buildingName.includes("Agriculture")){
        document.body.setAttribute("data-building", "agriculture");
    }
}else{
    document.getElementById("roomName").textContent = "Unknown Room";
    document.getElementById("building").textContent = "-";
    document.getElementById("roomType").textContent = "-";
    document.getElementById("description").textContent = room || "No room data found.";
    document.getElementById("facilities").textContent = "-";
    document.getElementById("availability").textContent = "-";
    document.getElementById("floorLevel").textContent = "-";
}

function scanAgain(){
    localStorage.removeItem("room");
    window.location.href = "../Menu/scanqr.html";
}

function goHome(){
    window.location.href = "../Admin%20Side/menu.html";
}
</script>

</body>
</html>
