<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Information</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(130deg, #a9f99e, #46add5);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background:#fff;
    width:100%;
    max-width:500px;
    border-radius:28px;
    padding:28px 24px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    position:relative;
    overflow:hidden;
}

.container::before{
    content:"";
    position:absolute;
    top:-40px;
    right:-40px;
    width:140px;
    height:140px;
    background:rgba(0,102,51,0.08);
    border-radius:50%;
}

.header{
    text-align:center;
    position:relative;
    z-index:1;
}

.header h2{
    color:#006633;
    font-size:16px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:6px;
}

.header h1{
    color:#006633;
    font-size:28px;
    margin-bottom:18px;
}

img{
    width:100%;
    height:260px;
    object-fit:contain;
    background:#f8f8f8;
    border-radius:20px;
    padding:10px;
    margin-bottom:20px;
}

.info-card{
    background:#f7f7f7;
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
}

.info-card strong{
    display:block;
    color:#006633;
    margin-bottom:6px;
    font-size:15px;
}

.info-card p{
    color:#444;
    line-height:1.5;
}

.button-group{
    display:flex;
    gap:10px;
    margin-top:16px;
}

.button-group button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:16px;
    background:#19ced1;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:background 0.3s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.button-group button:hover{
    background:#16d442;
}

.button-group button i{
    font-size:16px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Building Information</h2>
        <h1 id="buildingName">Building Name</h1>
    </div>

    <img id="buildingImage"
    src="https://via.placeholder.com/500x220?text=CSUL"
    alt="Building">

    <div class="info-card">
        <strong>Category</strong>
        <p id="category"></p>
    </div>

    <div class="info-card">
        <strong>Description</strong>
        <p id="description"></p>
    </div>

    <div class="info-card">
        <strong>Office Hours</strong>
        <p id="hours"></p>
    </div>

    <div class="button-group">
        <button onclick="goHome()">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>

        <button onclick="scanAgain()">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Scan QR Again</span>
        </button>
    </div>

</div>

<script>
const building = localStorage.getItem("building");

const info = {
    "https://cicsbuilding.com":{
        name:"College of Information and Computing Sciences (CICS) Building",
        category:"Academic",
        description:"The CICS Building houses classrooms, laboratories, and faculty offices for Information and Computing Sciences students.",
        hours:"Monday - Friday (7:00 AM - 5:00 PM)",
        image:"cics logo.jpg"
    },

    "https://agriculturebuilding.com":{
        name:"College of Agriculture Building",
        category:"Academic",
        description:"The College of Agriculture Building supports agricultural education and related laboratory activities.",
        hours:"Monday - Friday (7:00 AM - 5:00 PM)",
        image:"logo agri1.jpg"
    },

    "https://chmbuilding.com":{
        name:"College of Hospitality Management Building",
        category:"Academic",
        description:"This building provides facilities for hospitality management classes and practical training.",
        hours:"Monday - Friday (7:00 AM - 5:00 PM)",
        image:"../Images/chmlogo.png"
    },

    "https://ctedbuilding.com":{
        name:"College of Teacher Education Building",
        category:"Academic",
        description:"The College of Teacher Education Building contains classrooms, offices, and learning facilities for education students.",
        hours:"Monday - Friday (7:00 AM - 5:00 PM)",
        image:"ctedlogo.png"
    },

    "https://library.com":{
        name:"CSUL Library",
        category:"Academic",
        description:"The CSUL Library provides books, journals, computers, and study spaces for students.",
        hours:"Monday - Friday (7:00 AM - 5:00 PM)",
        image:"../Images/4th-1Sem - BSHM.png"
    }
};

if(building && info[building]){
    document.getElementById("buildingName").innerHTML = info[building].name;
    document.getElementById("category").innerHTML = info[building].category;
    document.getElementById("description").innerHTML = info[building].description;
    document.getElementById("hours").innerHTML = info[building].hours;
    document.getElementById("buildingImage").src = info[building].image;
}else{
    // No result found lang ang ipapakita
    document.getElementById("buildingName").innerHTML = "No result found";

    // Hide image and all info cards
    document.getElementById("buildingImage").style.display = "none";
    document.querySelectorAll(".info-card").forEach(card => {
        card.style.display = "none";
    });
}

function scanAgain(){
    localStorage.removeItem("building");
    window.location.href = "scanqr.html";
}

function goHome(){
    window.location.href = "menu.html";
}
</script>

</body>
</html>
