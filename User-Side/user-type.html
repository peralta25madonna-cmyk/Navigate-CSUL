<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select User Type</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(130deg, #a9f99e, #46add5);
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
    text-align:center;
}

/* LOGO */
.logo{
    width:110px;
    height:110px;
    margin:0 auto 20px;
    border-radius:50%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
    overflow:hidden;
}

.logo img{
    width:130%;
    height:130%;
    object-fit:contain;
}

h1{
    color:white;
    font-size:2rem;
    margin-bottom:10px;
}

.subtitle{
    color:rgba(255,255,255,.9);
    margin-bottom:35px;
    font-size:15px;
}

.card{
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;

    display:flex;
    align-items:center;
    gap:18px;

    cursor:pointer;
    transition:.3s;
    color:white;
}

.card:hover{
    transform:translateY(-5px) scale(1.02);
    background:rgba(255,255,255,.25);
}

.icon{
    width:60px;
    height:60px;
    border-radius:18px;
    background:white;
    color:#006633;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
}

.info{
    flex:1;
    text-align:center;
}

.info h3{
    font-size:18px;
    margin-bottom:5px;
}
</style>
</head>
<body>

<div class="container">

    <!-- PALITAN ANG PATH NG LOGO -->
    <div class="logo">
        <img src="logo.png" alt="Navigate CSUL Logo">
    </div>

    <h1>Welcome to Navigate CSUL</h1>
    <p class="subtitle">Select your role to continue.</p>

    <div class="card" onclick="selectRole('Student')">
        <div class="icon">
            <i class="fa-solid fa-user-graduate"></i>
        </div>
        <div class="info">
            <h3>Student</h3>
        </div>
    </div>

    <div class="card" onclick="selectRole('Faculty')">
        <div class="icon">
            <i class="fa-solid fa-chalkboard-user"></i>
        </div>
        <div class="info">
            <h3>Faculty</h3>
        </div>
    </div>

    <div class="card" onclick="selectRole('Staff')">
        <div class="icon">
            <i class="fa-solid fa-briefcase"></i>
        </div>
        <div class="info">
            <h3>Staff</h3>
        </div>
    </div>

    <div class="card" onclick="selectRole('Visitor')">
        <div class="icon">
            <i class="fa-solid fa-person-walking"></i>
        </div>
        <div class="info">
            <h3>Visitor</h3>
        </div>
    </div>

</div>

<script>
    console.log(localStorage.getItem("currentLocation"));
function selectRole(role){
    localStorage.setItem("userRole", role);

    // Redirect to next page
    window.location.href = "menu.html";
}
</script>

</body>
</html>
